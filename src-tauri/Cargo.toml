[package]
name = "covalent"
version = "1.8.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
notify = "7"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
